<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Hey, I'm Lakshay. Data analyst and gamer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22D3EE" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="t1">
      <rect x="50" y="92" width="0" height="76">
        <animate attributeName="width" from="0" to="580" dur="1.4s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="t2">
      <rect x="50" y="180" width="0" height="34">
        <animate attributeName="width" from="0" to="540" dur="1.6s" begin="2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .m { font-family: 'Courier New', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; font-weight: 700; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes press { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .chip { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
    .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s ease-out 1s forwards; }
    .area { animation: fade 1s ease 2.4s both; }
    .pt { animation: fade .4s ease both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .star { animation: twinkle 2.4s ease-in-out infinite; }
    .float { animation: float 3s ease-in-out infinite; }
    .btn { animation: press 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .line { stroke-dashoffset: 0; } }
  </style>

  <!-- background -->
  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="338" rx="21" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-width="2"/>

  <!-- twinkling pixels -->
  <rect class="star" x="610" y="40" width="4" height="4" fill="#A78BFA"/>
  <rect class="star" style="animation-delay:.6s" x="990" y="30" width="4" height="4" fill="#22D3EE"/>
  <rect class="star" style="animation-delay:1.2s" x="30" y="318" width="4" height="4" fill="#FACC15"/>
  <rect class="star" style="animation-delay:1.8s" x="620" y="318" width="4" height="4" fill="#22D3EE"/>
  <rect class="star" style="animation-delay:.9s" x="980" y="230" width="4" height="4" fill="#A78BFA"/>
  <rect class="star" style="animation-delay:.3s" x="560" y="20" width="3" height="3" fill="#FACC15"/>

  <!-- HUD -->
  <text class="m" x="50" y="58" font-size="13" letter-spacing="2" fill="#22D3EE">1UP  |  PLAYER: LAKSHAY GUPTA</text>

  <!-- title (typed) -->
  <g clip-path="url(#t1)" filter="url(#glow)">
    <text class="m" x="50" y="150" font-size="56" fill="#FFFFFF">Hey, I’m Lakshay</text>
  </g>

  <!-- subtitle (typed) -->
  <g clip-path="url(#t2)">
    <text class="m" x="50" y="204" font-size="22" fill="#A5B4FC">I turn messy data into clear answers.</text>
  </g>
  <rect y="184" width="12" height="24" fill="#22D3EE">
    <animate attributeName="x" from="50" to="540" dur="1.6s" begin="2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.8s" repeatCount="indefinite"/>
  </rect>

  <!-- chips -->
  <g class="chip" style="animation-delay:3.7s">
    <rect x="50" y="236" width="200" height="30" rx="6" fill="#0F172A" stroke="#22D3EE"/>
    <text class="m" x="150" y="256" font-size="13" letter-spacing="1" text-anchor="middle" fill="#22D3EE">CLASS: DATA ANALYST</text>
  </g>
  <g class="chip" style="animation-delay:3.9s">
    <rect x="262" y="236" width="130" height="30" rx="6" fill="#0F172A" stroke="#A78BFA"/>
    <text class="m" x="327" y="256" font-size="13" letter-spacing="1" text-anchor="middle" fill="#A78BFA">SIDE: GAMER</text>
  </g>
  <g class="chip" style="animation-delay:4.1s">
    <rect x="404" y="236" width="130" height="30" rx="6" fill="#0F172A" stroke="#4ADE80"/>
    <text class="m" x="469" y="256" font-size="13" letter-spacing="1" text-anchor="middle" fill="#4ADE80">BASE: DELHI</text>
  </g>

  <!-- press start -->
  <text class="m blink" x="50" y="304" font-size="16" letter-spacing="3" fill="#FACC15">&gt; PRESS START_</text>

  <!-- dashboard card -->
  <rect x="650" y="36" width="310" height="196" rx="14" fill="#0F172A" fill-opacity=".85" stroke="#22D3EE" stroke-opacity=".55" stroke-width="1.5"/>
  <line x1="650" y1="64" x2="960" y2="64" stroke="#22D3EE" stroke-opacity=".25"/>
  <circle cx="668" cy="50" r="4" fill="#EF4444"/>
  <circle cx="682" cy="50" r="4" fill="#FACC15"/>
  <circle cx="696" cy="50" r="4" fill="#4ADE80"/>
  <text class="m" x="940" y="54" font-size="11" text-anchor="end" letter-spacing="1" fill="#64748B">dashboard.exe</text>
  <line x1="672" y1="212" x2="940" y2="212" stroke="#334155" stroke-width="1.5"/>

  <!-- bars -->
  <rect class="bar" style="animation-delay:.6s"  x="676" y="172" width="22" height="40"  rx="2" fill="#8B5CF6" fill-opacity=".4"/>
  <rect class="bar" style="animation-delay:.75s" x="714" y="152" width="22" height="60"  rx="2" fill="#8B5CF6" fill-opacity=".4"/>
  <rect class="bar" style="animation-delay:.9s"  x="752" y="164" width="22" height="48"  rx="2" fill="#8B5CF6" fill-opacity=".4"/>
  <rect class="bar" style="animation-delay:1.05s" x="790" y="127" width="22" height="85"  rx="2" fill="#8B5CF6" fill-opacity=".4"/>
  <rect class="bar" style="animation-delay:1.2s" x="828" y="142" width="22" height="70"  rx="2" fill="#8B5CF6" fill-opacity=".4"/>
  <rect class="bar" style="animation-delay:1.35s" x="866" y="102" width="22" height="110" rx="2" fill="#8B5CF6" fill-opacity=".4"/>
  <rect class="bar" style="animation-delay:1.5s" x="904" y="82"  width="22" height="130" rx="2" fill="#8B5CF6" fill-opacity=".4"/>

  <!-- area + line + points -->
  <path class="area" d="M687 158 L725 138 L763 150 L801 113 L839 128 L877 88 L915 68 L915 212 L687 212 Z" fill="url(#area)"/>
  <path class="line" pathLength="1" d="M687 158 L725 138 L763 150 L801 113 L839 128 L877 88 L915 68" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#FFFFFF" stroke="#22D3EE" stroke-width="2">
    <circle class="pt" style="animation-delay:1.0s" cx="687" cy="158" r="4"/>
    <circle class="pt" style="animation-delay:1.25s" cx="725" cy="138" r="4"/>
    <circle class="pt" style="animation-delay:1.5s" cx="763" cy="150" r="4"/>
    <circle class="pt" style="animation-delay:1.75s" cx="801" cy="113" r="4"/>
    <circle class="pt" style="animation-delay:2.0s" cx="839" cy="128" r="4"/>
    <circle class="pt" style="animation-delay:2.25s" cx="877" cy="88" r="4"/>
    <circle class="pt" style="animation-delay:2.5s" cx="915" cy="68" r="5"/>
  </g>

  <!-- gamepad -->
  <g transform="translate(690,252)">
    <g class="float">
      <rect x="0" y="0" width="180" height="64" rx="28" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2.5"/>
      <rect x="22" y="26" width="32" height="10" rx="2" fill="#22D3EE"/>
      <rect x="33" y="15" width="10" height="32" rx="2" fill="#22D3EE"/>
      <rect x="78" y="30" width="10" height="4" rx="2" fill="#64748B"/>
      <rect x="94" y="30" width="10" height="4" rx="2" fill="#64748B"/>
      <circle class="btn" style="animation-delay:0s"   cx="146" cy="20" r="6" fill="#4ADE80"/>
      <circle class="btn" style="animation-delay:.4s"  cx="161" cy="32" r="6" fill="#EF4444"/>
      <circle class="btn" style="animation-delay:.8s"  cx="146" cy="44" r="6" fill="#FACC15"/>
      <circle class="btn" style="animation-delay:1.2s" cx="131" cy="32" r="6" fill="#22D3EE"/>
    </g>
  </g>
  <text class="m blink" x="885" y="290" font-size="12" letter-spacing="1" fill="#22D3EE">P1 READY</text>
</svg>
