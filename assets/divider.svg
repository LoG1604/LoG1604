<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation">
<defs><linearGradient id="d" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs>
<style>
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .dl { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<line class="dl" x1="0" y1="12" x2="1000" y2="12" stroke="url(#d)" stroke-width="3"/>
<rect y="6" width="12" height="12" fill="#FACC15"><animate attributeName="x" from="0" to="988" dur="4s" repeatCount="indefinite"/></rect>
</svg>