<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Player stats: 3 data projects, 1,820 rows cleaned, 10 cities analysed, 1,470 employees analysed">
<defs><filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
    .m { font-family: 'Courier New', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; font-weight: 700; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes fillx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes glowpulse { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    .card { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    .num { animation: pop .5s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: 0% 50%; }
    .load { transform-box: fill-box; transform-origin: 0% 50%; animation: fillx 1.1s cubic-bezier(.2,.8,.2,1) both; }
  </style>
<rect width="1000" height="170" rx="18" fill="#0B1020"/>
<rect x="1" y="1" width="998" height="168" rx="17" fill="none" stroke="#22D3EE" stroke-opacity=".3" stroke-width="2"/>
<g class="card" style="animation-delay:0.15s">
<rect x="20" y="20" width="227" height="130" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".6" stroke-width="1.5"/>
<text class="m" x="38" y="50" font-size="12" letter-spacing="2" fill="#94A3B8">DATA PROJECTS</text>
<text class="m num" style="animation-delay:0.44999999999999996s" x="38" y="100" font-size="44" fill="#22D3EE" filter="url(#glow)">3</text>
<text class="m" x="38" y="122" font-size="12" fill="#64748B">MagicBricks, HR, Churn</text>
<rect x="38" y="134" width="191" height="5" rx="2.5" fill="#1E293B"/>
<rect class="load" style="animation-delay:0.55s" x="38" y="134" width="191" height="5" rx="2.5" fill="#22D3EE"/>
</g>
<g class="card" style="animation-delay:0.35s">
<rect x="263" y="20" width="227" height="130" rx="12" fill="#0F172A" stroke="#4ADE80" stroke-opacity=".6" stroke-width="1.5"/>
<text class="m" x="281" y="50" font-size="12" letter-spacing="2" fill="#94A3B8">ROWS CLEANED</text>
<text class="m num" style="animation-delay:0.6499999999999999s" x="281" y="100" font-size="44" fill="#4ADE80" filter="url(#glow)">1,820</text>
<text class="m" x="281" y="122" font-size="12" fill="#64748B">property listings</text>
<rect x="281" y="134" width="191" height="5" rx="2.5" fill="#1E293B"/>
<rect class="load" style="animation-delay:0.75s" x="281" y="134" width="191" height="5" rx="2.5" fill="#4ADE80"/>
</g>
<g class="card" style="animation-delay:0.55s">
<rect x="506" y="20" width="227" height="130" rx="12" fill="#0F172A" stroke="#A78BFA" stroke-opacity=".6" stroke-width="1.5"/>
<text class="m" x="524" y="50" font-size="12" letter-spacing="2" fill="#94A3B8">CITIES ANALYSED</text>
<text class="m num" style="animation-delay:0.8500000000000001s" x="524" y="100" font-size="44" fill="#A78BFA" filter="url(#glow)">10</text>
<text class="m" x="524" y="122" font-size="12" fill="#64748B">price per sqft</text>
<rect x="524" y="134" width="191" height="5" rx="2.5" fill="#1E293B"/>
<rect class="load" style="animation-delay:0.9500000000000001s" x="524" y="134" width="191" height="5" rx="2.5" fill="#A78BFA"/>
</g>
<g class="card" style="animation-delay:0.7500000000000001s">
<rect x="749" y="20" width="227" height="130" rx="12" fill="#0F172A" stroke="#FACC15" stroke-opacity=".6" stroke-width="1.5"/>
<text class="m" x="767" y="50" font-size="12" letter-spacing="2" fill="#94A3B8">EMPLOYEES ANALYSED</text>
<text class="m num" style="animation-delay:1.05s" x="767" y="100" font-size="44" fill="#FACC15" filter="url(#glow)">1,470</text>
<text class="m" x="767" y="122" font-size="12" fill="#64748B">attrition dashboard</text>
<rect x="767" y="134" width="191" height="5" rx="2.5" fill="#1E293B"/>
<rect class="load" style="animation-delay:1.1500000000000001s" x="767" y="134" width="191" height="5" rx="2.5" fill="#FACC15"/>
</g>
</svg>