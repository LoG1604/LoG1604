name: Generate Snake Animation

on:
  # runs automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # lets you run it manually from the Actions tab
  workflow_dispatch:

  # runs when you push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate github-snake.svg
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # builds the snake from your contribution graph
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#22d3ee
            dist/github-snake-light.svg?color_snake=#8b5cf6

      # pushes the generated files to a separate "output" branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
